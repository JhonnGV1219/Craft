{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
    <div class="row">
        <div class="col-md-3"></div>

        <div class="col-md-6">
            <h1>Nuevo Material</h1>
            <hr>

            <form action="/guardar_material/" method="POST">
                {% csrf_token %}

                <b>Nombre:</b>
                <input type="text" name="nombre" class="form-control" required>

                <b>Unidad:</b>
                <input type="text" name="unidad" class="form-control" placeholder="kg, m3, unidades" required>

                <br>
                <div class="text-center">
                    <button class="btn btn-success">Guardar</button>
                    <a href="/showmaterial/" class="btn btn-danger">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<br><br><br><br><br>
{% endblock %}
