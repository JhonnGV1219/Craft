{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-box-seam me-2"></i>Registro de Material</h5>
        </div>
        <div class="card-body p-4">
          <form action="/guardar_material/" method="POST" id="form_material">
            {% csrf_token %}
            <div class="row g-3">

              <div class="col-12">
                <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                       placeholder="Ej: Cemento Portland, Varilla 12mm..." maxlength="100">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Unidad de medida <span class="text-danger">*</span></label>
                <input type="text" name="unidad" id="unidad" class="form-control"
                       placeholder="Ej: kg, m3, unidades, lt..." maxlength="20">
                <small class="text-muted">Indique la unidad con la que se cuantifica el material.</small>
              </div>

            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showmaterial/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

<script>
$("#form_material").validate({
  rules: {
    nombre : { required: true, minlength: 2, maxlength: 100 },
    unidad : { required: true, minlength: 1, maxlength: 20 }
  },
  messages: {
    nombre : { required: "El nombre del material es obligatorio", minlength: "Mínimo 2 caracteres", maxlength: "Máximo 100 caracteres" },
    unidad : { required: "La unidad de medida es obligatoria", maxlength: "Máximo 20 caracteres" }
  },
  errorClass: "text-danger small", errorElement: "div",
  highlight: function(el){ $(el).addClass("is-invalid"); },
  unhighlight: function(el){ $(el).removeClass("is-invalid"); }
});
</script>
{% endblock %}
