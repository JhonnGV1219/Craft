{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-truck me-2"></i>Registro de Maquinaria</h5>
        </div>
        <div class="card-body p-4">
          <form action="/guardar_maquinaria/" method="POST"
                enctype="multipart/form-data" id="form_maquinaria">
            {% csrf_token %}
            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                       placeholder="Ej: Excavadora CAT 320" maxlength="50">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Tipo <span class="text-danger">*</span></label>
                <input type="text" name="tipo" id="tipo" class="form-control"
                       placeholder="Ej: Excavadora, Volqueta..." maxlength="50">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Estado <span class="text-danger">*</span></label>
                <select name="estado" id="estado" class="form-select">
                  <option value="disponible">Disponible</option>
                  <option value="en_uso">En Uso</option>
                  <option value="mantenimiento">Mantenimiento</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Imagen</label>
                <input type="file" name="imagen" id="imagen" class="form-control">
                <small class="text-muted">Formatos permitidos: PNG, JPG, JPEG</small>
              </div>

            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showmaquinaria/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

<script>
$("#imagen").fileinput({
  language: "es", allowedFileExtensions: ["png","jpg","jpeg"],
  showCaption: false, dropZoneEnabled: true, showClose: false
});

$("#form_maquinaria").validate({
  rules: {
    nombre : { required: true, minlength: 2, maxlength: 50 },
    tipo   : { required: true, minlength: 2, maxlength: 50 },
    estado : { required: true }
  },
  messages: {
    nombre : { required: "El nombre es obligatorio", minlength: "Mínimo 2 caracteres" },
    tipo   : { required: "El tipo es obligatorio" }
  },
  errorClass: "text-danger small", errorElement: "div",
  highlight: function(el){ $(el).addClass("is-invalid"); },
  unhighlight: function(el){ $(el).removeClass("is-invalid"); }
});
</script>
{% endblock %}
