{% extends "principal/plantillaPrincipal.html" %}
{% load static %}
{% block contenido %}
<br><br><br><br><br>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-truck me-2"></i>Registro de Maquinaria</h5>
        </div>
        <div class="card-body p-4">

          <form action="/guardar_maquinaria/" method="POST"
                enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Nombre</label>
                <input type="text" name="nombre" class="form-control"
                       placeholder="Ej: Excavadora CAT 320" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Tipo</label>
                <input type="text" name="tipo" class="form-control"
                       placeholder="Ej: Excavadora, Volqueta..." required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Estado</label>
                <select name="estado" class="form-select">
                  <option value="disponible">Disponible</option>
                  <option value="en_uso">En Uso</option>
                  <option value="mantenimiento">Mantenimiento</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Imagen</label>
                <input type="file" name="imagen" id="imagen" class="form-control">
              </div>
            </div>

            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showmaquinaria/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<br><br>

<script>
$("#imagen").fileinput({
  language: "es",
  allowedFileExtensions: ["png", "jpg", "jpeg"],
  showCaption: false,
  dropZoneEnabled: true,
  showClose: false
});
</script>
{% endblock %}
