{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-people me-2"></i>Registro de Cuadrilla</h5>
        </div>
        <div class="card-body p-4">

          <form action="/guardar_cuadrilla/" method="post">
            {% csrf_token %}

            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Nombre de la Cuadrilla</label>
                <input type="text" name="nombre" class="form-control"
                       placeholder="Ej: Cuadrilla Estructural A" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Tipo de Trabajo</label>
                <input type="text" name="tipo" class="form-control"
                       placeholder="Ej: Carpintería, Concreto, Acabados..." required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Cantidad de Trabajadores</label>
                <input type="number" name="cantidad" class="form-control"
                       min="1" placeholder="0" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Obra asignada</label>
                <select name="obra" class="form-select" required>
                  <option value="" disabled selected>— Seleccione —</option>
                  {% for o in obras %}
                  <option value="{{ o.id_obra }}">{{ o.nombre_obra }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showcuadrilla/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<br><br>
{% endblock %}
