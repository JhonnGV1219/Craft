{% extends "principal/plantillaPrincipal.html" %}
{% load static %}
{% block contenido %}
<br><br><br><br><br>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-flag me-2"></i>Registro de Hito</h5>
        </div>
        <div class="hero__caption">
        <div class="hero-text1">
            <div class="stock-text" data-animation="fadeInUp" data-delay=".8s">
                <h2>Registro de Hitos</h2>
                <h2>Registro de Hitos</h2>
            </div>
        </div>
        </div>

        <div class="card-body p-4">

          <form enctype="multipart/form-data" action="/guardar_hito/"
                method="post" id="form_nueva_hito">
            {% csrf_token %}

            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Nombre del Hito</label>
                <input type="text" name="nombre" class="form-control"
                       placeholder="Ej: Fundaciones terminadas" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="2"
                          placeholder="Detalle del hito" required></textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha de Inicio</label>
                <input type="date" name="fecha_in" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha Fin Estimada</label>
                <input type="date" name="fecha_fin" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Avance (%)</label>
                <div class="input-group">
                  <input type="number" name="avance" class="form-control"
                         placeholder="0.0" step="0.1" min="0" max="100" required>
                  <span class="input-group-text">%</span>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Estado</label>
                <select name="estado" class="form-select">
                  <option value="Pendiente">Pendiente</option>
                  <option value="En progreso">En progreso</option>
                  <option value="Completado">Completado</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Obra asociada</label>
                <select name="obra" class="form-select" required>
                  <option value="" disabled selected>— Seleccione una obra —</option>
                  {% for p in miobra %}
                  <option value="{{ p.id_obra }}">{{ p.nombre_obra }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Evidencia (PDF)</label>
                <input type="file" name="evidencias" id="evidencias" class="form-control">
              </div>
            </div>

            <hr>
            <center>
              <div class="d-flex justify-content-end gap-2">
              <a href="/showhitos/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar Hito
              </button>
            </div>
            </center>


          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<br><br>

<script>
$("#evidencias").fileinput({
  language: "es",
  allowedFileExtensions: ["pdf"],
  showCaption: false,
  dropZoneEnabled: true,
  showClose: false,
  showUpload: false,
  initialPreviewFileType: "pdf"
});
$(".fileinput-upload").hide();
</script>
{% endblock %}
