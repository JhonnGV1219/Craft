{% extends "principal/plantillaPrincipal.html" %}
{% load static %}
{% block contenido %}
<br><br><br><br><br>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">

      <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark">
          <h5 class="mb-0">
            <i class="bi bi-pencil-square me-2"></i>Editar Hito —
            <span class="fw-normal">{{ hitos.nombre_hito }}</span>
          </h5>
        </div>
        <div class="card-body p-4">

          <form enctype="multipart/form-data" action="/procesouphito/"
                method="post">
            {% csrf_token %}
            <input type="hidden" name="id_hito" value="{{ hitos.id_hito }}">

            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Nombre del Hito</label>
                <input type="text" name="nombre" class="form-control"
                       value="{{ hitos.nombre_hito }}" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Descripción</label>
                <textarea name="descripcion" class="form-control"
                          rows="2" required>{{ hitos.descripcion }}</textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha de Inicio</label>
                <input type="date" name="fecha_in" class="form-control"
                       value="{{ hitos.fecha_inicio|date:'Y-m-d' }}" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha Fin Estimada</label>
                <input type="date" name="fecha_fin" class="form-control"
                       value="{{ hitos.fecha_fin_estimado|date:'Y-m-d' }}" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Avance (%)</label>
                <div class="input-group">
                  <input type="number" name="avance" class="form-control"
                         value="{{ hitos.avance_porcentaje }}"
                         step="0.1" min="0" max="100" required>
                  <span class="input-group-text">%</span>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Estado</label>
                <select name="estado" class="form-select">
                  <option value="Pendiente"   {% if hitos.estado == "Pendiente"   %}selected{% endif %}>Pendiente</option>
                  <option value="En progreso" {% if hitos.estado == "En progreso" %}selected{% endif %}>En progreso</option>
                  <option value="Completado"  {% if hitos.estado == "Completado"  %}selected{% endif %}>Completado</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Obra asociada</label>
                <select name="obra" class="form-select" required>
                  {% for p in miobra %}
                  <option value="{{ p.id_obra }}"
                    {% if p.id_obra == hitos.obra_id_id %}selected{% endif %}>
                    {{ p.nombre_obra }}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Evidencia (PDF)</label>
                <input type="file" name="evidencias" id="evidencias" class="form-control">
              </div>
            </div>

            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showhitos/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="bi bi-check-circle"></i> Actualizar Hito
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
<br><br>

<script>
var pdfactual = "{% if hitos.evidencia %}{{ hitos.evidencia.url }}{% endif %}";
$("#evidencias").fileinput({
  language: "es",
  allowedFileExtensions: ["pdf"],
  showCaption: false,
  dropZoneEnabled: true,
  showClose: false,
  showUpload: false,
  initialPreview: pdfactual ? [pdfactual] : [],
  initialPreviewAsData: true,
  initialPreviewFileType: "pdf"
});
$(".fileinput-upload").hide();
</script>
{% endblock %}
