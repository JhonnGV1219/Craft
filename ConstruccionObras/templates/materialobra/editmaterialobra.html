{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            <h1>Editar Material de Obra</h1>
            <hr>
            <form action="/procesoupmaterialobra/" method="POST">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{ mo.id_material_obra }}">

                <b>Obra:</b>
                <select name="obra" class="form-control mb-2">
                    {% for o in obras %}
                    <option value="{{ o.id_obra }}" {% if o.id_obra == mo.obra.id_obra %}selected{% endif %}>
                        {{ o.nombre_obra }}
                    </option>
                    {% endfor %}
                </select>

                <b>Material:</b>
                <select name="material" class="form-control mb-2">
                    {% for m in materiales %}
                    <option value="{{ m.id_material }}" {% if m.id_material == mo.material.id_material %}selected{% endif %}>
                        {{ m.nombre }} ({{ m.unidad }})
                    </option>
                    {% endfor %}
                </select>

                <b>Cantidad Estimada:</b>
                <input type="number" step="any" name="estimada" class="form-control mb-2" value="{{ mo.cantidad_estimada }}" required>

                <b>Cantidad Real:</b>
                <input type="number" step="any" name="real" class="form-control mb-2" value="{{ mo.cantidad_real }}" required>

                <br>
                <div class="text-center">
                    <button class="btn btn-success"><i class="bi bi-check-circle"></i> Actualizar</button>
                    <a href="/showmaterialobra/" class="btn btn-danger"><i class="bi bi-x-circle"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<br><br><br>
{% endblock %}
