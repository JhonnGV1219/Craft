{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark">
          <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Material de Obra</h5>
        </div>
        <div class="card-body p-4">
          <form action="/procesoupmaterialobra/" method="POST" id="form_edit_matobra">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ mo.id_material_obra }}">
            <div class="row g-3">

              <div class="col-12">
                <label class="form-label fw-semibold">Obra <span class="text-danger">*</span></label>
                <select name="obra" id="obra" class="form-select">
                  {% for o in obras %}
                  <option value="{{ o.id_obra }}" {% if o.id_obra == mo.obra.id_obra %}selected{% endif %}>
                    {{ o.nombre_obra }}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Material <span class="text-danger">*</span></label>
                <select name="material" id="material" class="form-select">
                  {% for m in materiales %}
                  <option value="{{ m.id_material }}" {% if m.id_material == mo.material.id_material %}selected{% endif %}>
                    {{ m.nombre }} ({{ m.unidad }})
                  </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Cantidad Estimada <span class="text-danger">*</span></label>
                <input type="number" step="any" name="estimada" id="estimada"
                       class="form-control" min="0" value="{{ mo.cantidad_estimada }}">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Cantidad Real <span class="text-danger">*</span></label>
                <input type="number" step="any" name="real" id="real"
                       class="form-control" min="0" value="{{ mo.cantidad_real }}">
              </div>

            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showmaterialobra/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="bi bi-check-circle"></i> Actualizar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

<script>
$("#form_edit_matobra").validate({
  rules: {
    obra     : { required: true },
    material : { required: true },
    estimada : { required: true, number: true, min: 0 },
    real     : { required: true, number: true, min: 0 }
  },
  messages: {
    obra     : { required: "Seleccione una obra" },
    material : { required: "Seleccione un material" },
    estimada : { required: "Obligatorio", number: "Número inválido", min: "No puede ser negativa" },
    real     : { required: "Obligatorio", number: "Número inválido", min: "No puede ser negativa" }
  },
  errorClass: "text-danger small", errorElement: "div",
  highlight: function(el){ $(el).addClass("is-invalid"); },
  unhighlight: function(el){ $(el).removeClass("is-invalid"); }
});
</script>
{% endblock %}
