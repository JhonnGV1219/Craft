{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-clipboard-plus me-2"></i>Asignar Material a Obra</h5>
                </div>
                <div class="card-body p-4">
                    <form action="/guardar_materialobra/" method="POST">
                        {% csrf_token %}

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Obra</label>
                                <select name="obra" class="form-select" required>
                                    <option value="" disabled selected>— Seleccione una obra —</option>
                                    {% for o in obras %}
                                    <option value="{{ o.id_obra }}">{{ o.nombre_obra }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Material</label>
                                <select name="material" class="form-select" required>
                                    <option value="" disabled selected>— Seleccione un material —</option>
                                    {% for m in materiales %}
                                    <option value="{{ m.id_material }}">{{ m.nombre }} ({{ m.unidad }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Cantidad Estimada</label>
                                <input type="number" step="any" name="estimada"
                                       class="form-control" min="0" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Cantidad Real</label>
                                <input type="number" step="any" name="real"
                                       class="form-control" min="0" value="0" required>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/showmaterialobra/" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<br><br>
{% endblock %}
