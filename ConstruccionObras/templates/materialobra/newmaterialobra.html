{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-clipboard-plus me-2"></i>Asignar Material a Obra</h5>
        </div>
        <div class="card-body p-4">
          <form action="/guardar_materialobra/" method="POST" id="form_matobra">
            {% csrf_token %}
            <div class="row g-3">

              <div class="col-12">
                <label class="form-label fw-semibold">Obra <span class="text-danger">*</span></label>
                <select name="obra" id="obra" class="form-select">
                  <option value="" disabled selected>— Seleccione una obra —</option>
                  {% for o in obras %}
                  <option value="{{ o.id_obra }}">{{ o.nombre_obra }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Material <span class="text-danger">*</span></label>
                <select name="material" id="material" class="form-select">
                  <option value="" disabled selected>— Seleccione un material —</option>
                  {% for m in materiales %}
                  <option value="{{ m.id_material }}">{{ m.nombre }} ({{ m.unidad }})</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Cantidad Estimada <span class="text-danger">*</span></label>
                <input type="number" step="any" name="estimada" id="estimada"
                       class="form-control" min="0" placeholder="0">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Cantidad Real <span class="text-danger">*</span></label>
                <input type="number" step="any" name="real" id="real"
                       class="form-control" min="0" value="0">
              </div>

            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showmaterialobra/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

<script>
$("#form_matobra").validate({
  rules: {
    obra      : { required: true },
    material  : { required: true },
    estimada  : { required: true, number: true, min: 0 },
    real      : { required: true, number: true, min: 0 }
  },
  messages: {
    obra      : { required: "Seleccione una obra" },
    material  : { required: "Seleccione un material" },
    estimada  : { required: "La cantidad estimada es obligatoria", number: "Ingrese un número válido", min: "No puede ser negativa" },
    real      : { required: "La cantidad real es obligatoria", number: "Ingrese un número válido", min: "No puede ser negativa" }
  },
  errorClass: "text-danger small", errorElement: "div",
  highlight: function(el){ $(el).addClass("is-invalid"); },
  unhighlight: function(el){ $(el).removeClass("is-invalid"); }
});
</script>
{% endblock %}
