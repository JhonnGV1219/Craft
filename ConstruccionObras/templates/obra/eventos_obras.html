{% extends "principal/plantillaPrincipal.html" %}
{% block contenido %}

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<br><br><br><br><br>

<div class="container-fluid px-4">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h4 class="mb-0">
                <i class="bi bi-calendar3 me-2 text-primary"></i>Calendario de Obras
            </h4>
            <small class="text-muted">Planificación temporal de fases de la obra</small>
        </div>
        <a href="/newobras/" class="btn btn-success btn-sm">
            <i class="bi bi-plus-circle"></i> Nueva Obra
        </a>
    </div>

    <!-- Leyenda -->
    <div class="mb-3 d-flex flex-wrap gap-3" style="font-size:.85rem;">
        <span>
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;
                         background:#0d6efd;vertical-align:middle;margin-right:4px;"></span>
            Planificada
        </span>
        <span>
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;
                         background:#fd7e14;vertical-align:middle;margin-right:4px;"></span>
            En Ejecución
        </span>
        <span>
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;
                         background:#198754;vertical-align:middle;margin-right:4px;"></span>
            Finalizada
        </span>
        <span>
            <span style="display:inline-block;width:14px;height:14px;border-radius:50%;
                         background:#6c757d;vertical-align:middle;margin-right:4px;"></span>
            Suspendida
        </span>
    </div>

    <!-- Calendario -->
    <div class="card shadow-sm border-0 mb-5">
        <div class="card-body p-3">
            <div id="calendar"></div>
        </div>
    </div>

</div>

<!-- Modal detalle obra -->
<div class="modal fade" id="modalObra" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header" id="modalHeader">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm"
                        data-bs-dismiss="modal">
                    <i class="bi bi-x-circle"></i> Cerrar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar: se carga DESPUÉS del bloque para que jQuery base ya esté disponible -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
/* Eventos incrustados directamente desde Django — sin fetch, sin CSRF */
var eventosObras = {{ eventos_json|safe }};

document.addEventListener('DOMContentLoaded', function () {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView : 'dayGridMonth',
        locale      : 'es',
        height      : 650,
        selectable  : true,
        headerToolbar: {
            left  : 'prev,next today',
            center: 'title',
            right : 'dayGridMonth,timeGridWeek,listMonth'
        },
        buttonText: {
            today : 'Hoy',
            month : 'Mes',
            week  : 'Semana',
            list  : 'Lista'
        },

        /* Eventos incrustados — no depende de fetch ni de red */
        events: eventosObras,

        eventClick: function(info) {
            var obra  = info.event;
            var props = obra.extendedProps;
            var color = obra.backgroundColor || '#0d6efd';

            var inicio = obra.start
                ? obra.start.toLocaleDateString('es-CO', {
                    year: 'numeric', month: 'long', day: 'numeric'
                  })
                : '—';

            var estadoBadge = {
                'Planificada'  : 'bg-primary',
                'En ejecucion' : 'bg-warning text-dark',
                'Finalizada'   : 'bg-success',
                'Suspendida'   : 'bg-secondary'
            };
            var badge = estadoBadge[props.estado] || 'bg-secondary';

            document.getElementById('modalHeader').style.borderBottom = '4px solid ' + color;
            document.getElementById('modalTitulo').textContent = obra.title;
            document.getElementById('modalBody').innerHTML =
                fila('Estado',       '<span class="badge ' + badge + '">' + props.estado + '</span>') +
                fila('Descripción',  props.descripcion || '—') +
                fila('Inicio',       inicio) +
                fila('Fin estimado', props.fecha_fin || '—') +
                fila('Presupuesto',
                    props.presupuesto && props.presupuesto !== 'Sin definir'
                        ? '$ ' + parseFloat(props.presupuesto).toLocaleString('es-CO')
                        : '<span class="text-muted">Sin definir</span>'
                );

            var modal = new bootstrap.Modal(document.getElementById('modalObra'));
            modal.show();
            info.jsEvent.preventDefault();
        }
    });

    calendar.render();
});

function fila(label, value) {
    return '<div class="d-flex gap-2 mb-2" style="font-size:.93rem;">' +
               '<span style="font-weight:600;min-width:130px;color:#495057;">' + label + ':</span>' +
               '<span>' + value + '</span>' +
           '</div>';
}
</script>

{% endblock %}
