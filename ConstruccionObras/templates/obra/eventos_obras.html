{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendario de Obras — CrafteosSA</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- FullCalendar 6 -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }

        .navbar-top {
            background: #1a1a2e;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-top a { color: #fff; text-decoration: none; font-size: .9rem; }
        .navbar-top a:hover { color: #ffc107; }

        .calendar-wrapper {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,.08);
            padding: 24px;
            margin-top: 24px;
            margin-bottom: 40px;
        }

        /* Colores de estado en la leyenda */
        .legend-dot {
            display: inline-block;
            width: 14px; height: 14px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Modal de detalle */
        #modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #modal-overlay.show { display: flex; }
        #modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
            position: relative;
        }
        #modal-box h5 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
        #modal-close {
            position: absolute; top: 14px; right: 16px;
            background: none; border: none; font-size: 1.4rem;
            cursor: pointer; color: #6c757d;
        }
        #modal-close:hover { color: #dc3545; }
        .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: .92rem; }
        .detail-label { font-weight: 600; min-width: 130px; color: #495057; }
        .detail-value { color: #212529; }

        /* FullCalendar ajustes */
        .fc-toolbar-title { font-size: 1.1rem !important; }
        .fc-event { cursor: pointer; border: none !important; padding: 2px 6px; }
        .fc-event:hover { opacity: .85; }
    </style>
</head>
<body>

<!-- Barra de navegación simple -->
<nav class="navbar-top">
    <span style="font-weight:700; font-size:1rem; color:#ffc107;">
        <i class="bi bi-building me-2"></i>CrafteosSA
    </span>
    <div style="display:flex; gap:20px;">
        <a href="/"><i class="bi bi-house me-1"></i>Inicio</a>
        <a href="/showobras/"><i class="bi bi-list-ul me-1"></i>Obras</a>
        <a href="/dashboard/"><i class="bi bi-bar-chart me-1"></i>Dashboard</a>
        <a href="/showavance/"><i class="bi bi-journal-text me-1"></i>Bitácora</a>
    </div>
</nav>

<div class="container">
    <div class="calendar-wrapper">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h4 class="mb-0"><i class="bi bi-calendar3 me-2 text-primary"></i>Calendario de Obras</h4>
                <small class="text-muted">Planificación temporal de fases de la obra</small>
            </div>
            <a href="/newobras/" class="btn btn-success btn-sm">
                <i class="bi bi-plus-circle"></i> Nueva Obra
            </a>
        </div>

        <!-- Leyenda de colores -->
        <div class="mb-3 d-flex flex-wrap gap-3" style="font-size:.85rem;">
            <span><span class="legend-dot" style="background:#0d6efd;"></span>Planificada</span>
            <span><span class="legend-dot" style="background:#fd7e14;"></span>En Ejecución</span>
            <span><span class="legend-dot" style="background:#198754;"></span>Finalizada</span>
            <span><span class="legend-dot" style="background:#6c757d;"></span>Suspendida</span>
        </div>

        <!-- Calendario -->
        <div id="calendar"></div>

    </div>
</div>

<!-- Modal de detalle -->
<div id="modal-overlay">
    <div id="modal-box">
        <button id="modal-close" onclick="cerrarModal()">×</button>
        <h5 id="modal-title"></h5>
        <div id="modal-body"></div>
        <div class="mt-3 text-end">
            <button class="btn btn-outline-secondary btn-sm" onclick="cerrarModal()">
                <i class="bi bi-x-circle"></i> Cerrar
            </button>
        </div>
    </div>
</div>

<!-- FullCalendar JS (autónomo, no necesita jQuery) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView : 'dayGridMonth',
        locale      : 'es',
        height      : 620,
        selectable  : true,
        headerToolbar: {
            left  : 'prev,next today',
            center: 'title',
            right : 'dayGridMonth,timeGridWeek,listMonth'
        },
        buttonText: {
            today     : 'Hoy',
            month     : 'Mes',
            week      : 'Semana',
            list      : 'Lista'
        },

        /* Feed de eventos desde el endpoint Django */
        events: {
            url   : '/eventos_obras/',
            method: 'GET',
            failure: function() {
                alert('Error al cargar los eventos. Verifique que el servidor esté activo.');
            }
        },

        /* Al hacer click en un evento mostrar modal */
        eventClick: function(info) {
            var obra  = info.event;
            var props = obra.extendedProps;

            document.getElementById('modal-title').textContent = obra.title;

            var inicio = obra.start
                ? obra.start.toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' })
                : '—';
            var fin = props.fecha_fin || '—';

            var estadoColor = {
                'Planificada'  : 'bg-primary',
                'En ejecucion' : 'bg-warning text-dark',
                'Finalizada'   : 'bg-success',
                'Suspendida'   : 'bg-secondary'
            };
            var badgeClass = estadoColor[props.estado] || 'bg-secondary';

            document.getElementById('modal-body').innerHTML =
                row('Estado',       '<span class="badge ' + badgeClass + '">' + props.estado + '</span>') +
                row('Descripción',  props.descripcion || '—') +
                row('Inicio',       inicio) +
                row('Fin estimado', fin) +
                row('Presupuesto',  props.presupuesto && props.presupuesto !== 'None'
                                    ? '$ ' + parseFloat(props.presupuesto).toLocaleString('es-CO')
                                    : 'Sin definir');

            document.getElementById('modal-overlay').classList.add('show');
            info.jsEvent.preventDefault();
        },

        /* Tooltip al pasar el mouse */
        eventMouseEnter: function(info) {
            info.el.setAttribute('title', info.event.extendedProps.estado);
        }
    });

    calendar.render();
});

function row(label, value) {
    return '<div class="detail-row">' +
               '<span class="detail-label">' + label + ':</span>' +
               '<span class="detail-value">' + value + '</span>' +
           '</div>';
}

function cerrarModal() {
    document.getElementById('modal-overlay').classList.remove('show');
}

/* Cerrar modal al hacer click fuera */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) cerrarModal();
});
</script>

</body>
</html>
