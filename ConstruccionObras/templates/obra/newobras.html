{% extends "principal/plantillaPrincipal.html" %}
{% load static %}
{% block contenido %}
<br><br><br><br><br>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0"><i class="bi bi-building-add me-2"></i>Registro de Nueva Obra</h5>
        </div>
        <div class="card-body p-4">
          <form enctype="multipart/form-data" action="/guardar_obra/"
                method="post" id="form_obra">
            {% csrf_token %}
            <div class="row g-3">

              <div class="col-12">
                <label class="form-label fw-semibold">Nombre de la Obra <span class="text-danger">*</span></label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                       placeholder="Ej: Construcción Puente Río Verde" maxlength="50">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
                <textarea name="descripcion" id="descripcion" class="form-control"
                          rows="2" placeholder="Descripción general de la obra"></textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha de Inicio <span class="text-danger">*</span></label>
                <input type="date" name="fecha_in" id="fecha_in" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha Fin Estimada <span class="text-danger">*</span></label>
                <input type="date" name="fecha_fin" id="fecha_fin" class="form-control">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Presupuesto Total ($)</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input type="number" name="presupuesto" id="presupuesto" class="form-control"
                         placeholder="0.00" step="0.01" min="0">
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Estado <span class="text-danger">*</span></label>
                <select name="estado" id="estado" class="form-select">
                  <option value="Planificada">Planificada</option>
                  <option value="En ejecucion">En Ejecución</option>
                  <option value="Finalizada">Finalizada</option>
                  <option value="Suspendida">Suspendida</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Plano (PDF)</label>
                <input type="file" name="plano" id="plano" class="form-control">
              </div>

            </div>
            <hr>
            <div class="d-flex justify-content-end gap-2">
              <a href="/showobras/" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Cancelar
              </a>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Guardar Obra
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<br><br>

<script>
$("#plano").fileinput({
  language: "es", allowedFileExtensions: ["pdf"],
  showCaption: false, dropZoneEnabled: true,
  showClose: false, showUpload: false,
  initialPreviewFileType: "pdf"
});
$(".fileinput-upload").hide();

$.validator.addMethod("greaterThan", function(value, element, param) {
  var startVal = $(param).val();
  if (!startVal || !value) return true;
  var startDate = new Date(startVal);
  var endDate   = new Date(value);
  return !isNaN(startDate) && !isNaN(endDate) && endDate > startDate;
}, "La fecha de fin debe ser posterior a la fecha de inicio");

/* dateISO coincide con YYYY-MM-DD que entrega type="date" */
$.validator.addMethod("dateISO", function(value, element) {
  return this.optional(element) || /^\d{4}-\d{2}-\d{2}$/.test(value);
}, "Formato de fecha inválido");

$("#form_obra").validate({
  rules: {
    nombre      : { required: true, minlength: 3, maxlength: 50 },
    descripcion : { required: true, minlength: 5 },
    fecha_in    : { required: true, dateISO: true },
    fecha_fin   : { required: true, dateISO: true, greaterThan: "#fecha_in" },
    presupuesto : { min: 0, number: true }
  },
  messages: {
    nombre      : { required: "El nombre es obligatorio", minlength: "Mínimo 3 caracteres", maxlength: "Máximo 50 caracteres" },
    descripcion : { required: "La descripción es obligatoria" },
    fecha_in    : { required: "Seleccione la fecha de inicio" },
    fecha_fin   : { required: "Seleccione la fecha de fin", greaterThan: "La fecha fin debe ser posterior a la fecha de inicio" },
    presupuesto : { min: "El presupuesto no puede ser negativo", number: "Ingrese un número válido" }
  },
  errorClass: "text-danger small",
  errorElement: "div",
  highlight: function(el){ $(el).addClass("is-invalid"); },
  unhighlight: function(el){ $(el).removeClass("is-invalid"); }
});
</script>
{% endblock %}
